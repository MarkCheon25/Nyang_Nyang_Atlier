# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    hcr_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

hcr_arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    # ⚠️ Setup Assistant 는 이 두 목록을 빈 [] 로 생성한다("ros2_control URDF
    #    Modifications" 탭을 건너뛰면 인터페이스 정보를 못 얻기 때문). 비어 있으면
    #    컨트롤러가 configure 에 실패해 아예 뜨지 않고, 실행 시 다음으로 나타난다:
    #      "Action client not connected to action server:
    #       hcr_arm_controller/follow_joint_trajectory"
    #    아래 값은 hcr5_description/urdf/hcr5.ros2_control.xacro 의 선언과 일치해야 한다.
    #    Setup Assistant 재생성 시 다시 비므로 매번 확인할 것.
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true