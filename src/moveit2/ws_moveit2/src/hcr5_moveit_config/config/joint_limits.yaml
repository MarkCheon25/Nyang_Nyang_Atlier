# ══ HCR-5 관절 한계 (MoveIt 이 실제로 읽는 파일) ═══════════════════════════
#
# Setup Assistant 생성본을 손으로 보정했다. 재생성 시 아래 값이 되돌아가므로 주의.
# 원본 근거는 hcr5_description/config/joint_limits.yaml 에 함께 둔다.
#
# max_velocity 3.1416 rad/s (=180°/s)
#   URDF <limit velocity="..."> 에서 그대로 넘어왔다. HCR-5 User Manual v2.0
#   Appendix G 공식값. (물려받은 CAD 기본값 100 rad/s 는 실기의 약 32배였다)
#
# max_acceleration 3.5 rad/s² (≈200°/s²)  ← **추정치, 벤더 확인 대상**
#   URDF <limit> 태그에는 가속도 항목이 아예 없어서 Setup Assistant 가
#   has_acceleration_limits:false / max_acceleration:0 으로 생성한다.
#   그러면 AddTimeOptimalParameterization 이 "No acceleration limit was defined"
#   로 실패해 계획은 되는데 실행이 안 된다. 그래서 여기서 채워 넣는다.
#
#   값 근거: 공식 매뉴얼에 관절 최대 가속도 항목이 없다. Appendix G 의 정지거리·
#   정지시간(J1 34.67°/0.61s, J2 31.60°/0.55s, J3 29.08°/0.51s, 브레이크 0.03s)
#   에서 역산했다. 비상제동 기준이라 통상 운전 가속도는 이보다 작아야 한다.
#   그리기는 저속 연속 작업이므로 보수적으로 두고 실기에서 조정한다.

default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

joint_limits:
  joint_1:
    has_velocity_limits: true
    max_velocity: 3.1416
    has_acceleration_limits: true
    max_acceleration: 3.5
  joint_2:
    has_velocity_limits: true
    max_velocity: 3.1416
    has_acceleration_limits: true
    max_acceleration: 3.5
  joint_3:
    has_velocity_limits: true
    max_velocity: 3.1416
    has_acceleration_limits: true
    max_acceleration: 3.5
  joint_4:
    has_velocity_limits: true
    max_velocity: 3.1416
    has_acceleration_limits: true
    max_acceleration: 3.5
  joint_5:
    has_velocity_limits: true
    max_velocity: 3.1416
    has_acceleration_limits: true
    max_acceleration: 3.5
  joint_6:
    has_velocity_limits: true
    max_velocity: 3.1416
    has_acceleration_limits: true
    max_acceleration: 3.5
