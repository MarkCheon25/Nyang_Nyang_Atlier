# draw_cat 노드 파라미터.
#
# 여기 값만 고치면 **재빌드 없이** 동작이 바뀐다. draw_cat.launch.py 가 이 파일을
# 읽으므로 `colcon build` 는 필요 없고 (install 이 symlink 가 아니면 한 번은 필요),
# 노드를 다시 실행하기만 하면 된다.
#
# 노드 이름(draw_cat_node)이 최상위 키다 — src/draw_cat.cpp 의
# `make_shared("draw_cat_node")` 와 반드시 같아야 한다. 다르면 파라미터가
# 조용히 무시되고 전부 기본값으로 돈다.
draw_cat_node:
  ros__parameters:

    planning:
      # SRDF 의 group 이름. `<group name="hcr_arm">` — manipulator 아니다.
      group: "hcr_arm"
      # SRDF 의 group_state 이름. 그리기 시작 전 여기로 먼저 이동한다.
      home_pose: "hcr_home"
      # Cartesian Path 보간 간격(m). 작을수록 촘촘하지만 계산이 늘어난다.
      eef_step: 0.002
      # computeCartesianPath 가 돌려준 fraction 이 이 값 미만이면 그 스트로크는
      # **실행하지 않는다**. 1.0 = 경로 전체가 풀렸을 때만 그린다.
      # ⚠️ 0.0 으로 두면 1% 만 풀린 경로도 실행해서 엉뚱한 자취가 남는다.
      min_fraction: 0.9
      # 속도·가속 배율 (0~1). 실물은 감속 운전으로 시작한다(N4).
      # ⚠️ 이건 **그리는 구간** 배율이다. 펜업 이동은 아래 travel_* 를 쓴다.
      velocity_scaling: 0.1
      acceleration_scaling: 0.1

      # ── F3.1 순서 최적화 ─────────────────────────────────────────────────
      #
      # vision 규약상 스트로크들 사이에는 순서가 없다. Nearest Neighbor 로
      # "펜에서 가장 가까운 다음 스트로크"를 골라 **펜업 이동 거리**를 줄인다.
      #
      # false 로 두면 주어진 순서(csv 는 파일 순, params 는 names 순)를 그대로 쓴다.
      # 효과를 재려면 true/false 로 두 번 돌려 로그의 "펜업 이동" 값을 비교한다.
      optimize_order: true

      # 폐곡선의 시작점 회전.
      #
      # 닫힌 윤곽선에는 "첫 점"이라는 게 원래 없다 — 어느 정점에서 출발하든 한 바퀴
      # 돌아 제자리로 오므로 결과가 같다. 그래서 펜에서 **가장 가까운 정점**으로
      # 진입하도록 배열을 회전시킨다. flat[0] 은 비전 컨투어 추적기가 우연히 시작한
      # 점일 뿐이라 우리에게 유리할 이유가 없다.
      #
      # ⚠️ vision 토픽 경로는 전부 closed=true 라, 실전에서 절감폭의 대부분이 여기서 나온다.
      # ⚠️ 열린 스트로크(선)는 무관하다 — 그쪽은 양 끝점 중 가까운 쪽으로 방향을 뒤집는다.
      rotate_closed_start: true

      # ── 펜업 이동 (그리기와 분리) ────────────────────────────────────────
      #
      # 펜이 종이에서 떨어져 있는 구간이라 **어떤 경로로 가든 그림에 흔적이 없다.**
      # 그리기와 같은 속도로 조심스럽게 갈 이유가 없어서 따로 뗀다.
      #
      #   "cartesian" (기본) — 직선 이동. 경로가 항상 최단 직선이라 예측 가능하다.
      #   "joint"            — 관절공간 계획. 직선 제약이 없어 더 짧게 갈 수도 있지만,
      #                        OMPL RRT 는 샘플링 기반이라 **짧은 경로를 보장하지 않는다.**
      #                        돌아가는 경로가 나오면 배율 이득이 상쇄될 수 있다.
      travel_mode: "cartesian"

      # 펜업 이동 구간의 속도·가속 배율. 위 velocity_scaling 과 따로 논다.
      #
      # ⚠️ **travel_velocity_scaling 은 지금 축척에서 아무 효과가 없다** (실측 2026-08-14).
      #    이동 하나가 실제 4.5~24 mm 라 **최고 속도에 도달할 일이 없다** — 가속하다가 바로
      #    감속에 들어간다. 0.1 → 0.5 로 5 배 올려도 펜업 시간이 0.51 → 0.51 로 그대로였다.
      #    효과는 전부 아래 travel_acceleration_scaling 에서 나온다.
      #    (그림을 훨씬 크게 그리면 순항 구간이 생겨 의미가 살아날 수 있어 남겨 둔다.)
      travel_velocity_scaling: 0.5
      #
      # ⚠️ **이쪽이 진짜 손잡이다.** 가감속만으로 이뤄진 이동이라 t = 2√(d/a) 가 정확히
      #    맞는다 — 실측 여섯 점이 1/√a 에 상수항 없이 맞았다.
      #      가속  0.1   0.2   0.3   0.5   0.7   1.0
      #      펜업  0.51  0.36  0.29  0.23  0.19  0.16 s
      #    시뮬에서 1.0 이 최선이었다 (합계 최소, 꺾이는 지점 없음).
      #    상세: docs/Trajectory Optimization.md §4.3
      #
      # 🔴 **실물로 옮기기 전에 하드웨어 쪽 확인이 필요하다.** 1.0 은 관절 가속 한계의
      #    100 % 다. 걱정되는 것은 속도가 아니라 **도착 시 급감속**이고, 펜이 BRD §2.3
      #    대로 플랜지에 테이프 고정이라 컴플라이언스가 없다는 점이다.
      #
      #    지금 상태의 안전 여유:
      #      · 이 값은 **펜업 구간에만** 걸린다. 종이에 닿는 그리기는 velocity_scaling
      #        (0.1) 그대로다 — 급감속이 일어나는 순간에 펜은 종이에서 8 mm 떠 있다.
      #      · 실물에 옮길 때 되돌리는 법은 이 한 줄을 0.5(또는 0.1)로 낮추는 것뿐이다.
      #        재빌드 필요 없다.
      #
      #    물어봐야 할 것은 docs/Pipeline Integration Status.md §5 "하드웨어" 에 정리해 뒀다.
      travel_acceleration_scaling: 1.0

      # 펜업 이동의 보간 간격(m). 종이에 안 닿으니 그리기(eef_step)만큼 촘촘할 필요가 없다.
      travel_eef_step: 0.01

    # ── 종이 → 로봇 좌표 변환 (F4.1) ────────────────────────────────────────
    paper:
      # true  : 현재(home) 자세의 펜 끝 위치를 종이 원점으로 삼는다.
      #         카메라 캘리브레이션 없이 도는 지금의 동작이다.
      # false : 아래 origin_x/y/z 를 로봇 좌표계의 종이 원점으로 쓴다.
      #         vision 이 종이 위치를 넘겨주기 시작하면 이쪽으로 전환한다.
      use_current_pose_as_origin: true
      origin_x: 0.0
      origin_y: 0.0
      origin_z: 0.0

      # true 면 실제 좌표의 경계상자 중심을 자동으로 원점에 맞춘다.
      # vision 이 넘겨준 좌표는 범위를 미리 알 수 없으므로, map.csv 를 쓸 때는
      # 이걸 켜는 편이 낫다 — center_x_mm/center_y_mm 를 손으로 맞출 필요가 없다.
      auto_center: false

      # 그림의 어느 점을 원점에 맞출지 (mm). auto_center: true 면 무시된다.
      center_x_mm: 81.0
      center_y_mm: 51.0

      # mm → m 축척. 0.00025 면 1/4000 로 줄어들어 고양이가 약 1.5cm × 1.2cm 가
      # 된다 (RViz 기본 시점에서는 점으로 보일 만큼 작다).
      # ⚠️ 키우면 반경이 커져 Cartesian fraction 이 떨어질 수 있다 — 바꾼 뒤
      #    로그의 fraction 값을 반드시 확인할 것.
      scale: 0.00025

      # 펜업 높이(m). 스트로크 사이를 이동할 때 이만큼 들어올린다.
      pen_lift: 0.008

    # ── 펜 (BRD §2.3: 플랜지에 테이프 고정, 컴플라이언스 없음) ───────────────
    pen:
      # 플랜지(그룹 끝 링크)에서 펜 끝까지의 거리(m), 플랜지 로컬 +z 방향.
      # hcr_robot_pen.xacro 의 pen_length 는 0.150 이지만 **실측 전 임시값**이다.
      #
      # ⚠️ 기본값 0.0 은 "펜을 무시하고 플랜지 기준으로 그린다"는 뜻이고, 지금
      #    확인된 동작이 이것이다. MoveIt 쪽 URDF 에는 아직 펜이 없다.
      #
      # ⚠️ use_current_pose_as_origin: true 인 동안에는 이 값을 바꿔도 결과가
      #    **바뀌지 않는다.** 원점도 펜 끝 기준으로 같이 밀리기 때문에 상쇄된다.
      #    종이 원점을 명시(false)할 때부터 실제로 의미를 갖는다.
      tip_offset_z: 0.0

    # ── RViz 시각화 ────────────────────────────────────────────────────────
    marker:
      topic: "pen_trace"
      ns: "cat_strokes"
      # 선 굵기(m)
      line_width: 0.001
      # R, G, B, A (0~1)
      color_rgba: [1.0, 0.0, 0.0, 1.0]
      # 다 그린 뒤 노드가 살아 있는 시간(초). RViz 가 마커를 받을 여유를 준다.
      hold_seconds: 5.0

    # ── 그릴 것 (vision 인터페이스 스펙: mm 좌표, 정렬 안 된 스트로크 집합) ──
    #
    # 지금은 가짜 고양이 데이터다. vision 이 붙으면 이 자리를 토픽/서비스가
    # 대체한다. F3.1(순서 최적화)이 다루는 것이 바로 이 목록의 순서다.
    #
    # 각 스트로크는 [x1,y1, x2,y2, ...] 로 **평탄하게** 편다 — ROS 2 파라미터가
    # 중첩 배열을 지원하지 않기 때문이다. 원소 개수는 반드시 짝수여야 하고,
    # 홀수면 노드가 그 스트로크를 건너뛰고 경고를 남긴다.
    strokes:
      # "params" — 아래 names/좌표를 쓴다 (개발·시험용 가짜 데이터)
      # "csv"    — vision 이 만든 map.csv 를 읽는다 (실제 경로)
      source: "params"

      # source: "csv" 일 때 읽을 파일.
      #   형식: stroke_idx,point_idx,x_mm,y_mm,closed  (헤더 줄은 있어도 없어도 됨)
      #
      # ⚠️ 이 형식이 vision ↔ moveit2 ↔ simulation 의 **유일한 결합점**이다.
      #    코드로 링크하지 않고 파일만 주고받는 것이 팀 설계다
      #    (근거: simulation 의 sim_core/include/atlier/sim/planned_map.hpp 주석).
      #    형식이 바뀌면 세 곳이 같이 깨지므로 혼자 바꾸지 말 것.
      #
      # vision 쪽에서 만드는 법:
      #   ros2 run vision_core stroke_map_cli --in ~/data/cat.png --out-dir ~/data/out
      #   → ~/data/out/map.csv
      csv_path: ""

      # 그릴 목록. 여기서 이름을 빼면 그 스트로크는 그리지 않는다.
      #
      # ⚠️ vision 규약상 **스트로크들 사이에는 순서가 없다.** 여기 적은 순서도 마찬가지라
      #    실제 그리는 순서는 F3.1(planning.optimize_order)이 다시 정한다. 주어진 순서를
      #    그대로 쓰고 싶으면 optimize_order 를 false 로 둔다.
      names: ["left_ear", "right_ear", "left_eye", "right_eye", "mouth"]

      # names 와 같은 순서로 폐곡선 여부. 생략하면 전부 false.
      # true 면 마지막 점에서 첫 점으로 돌아오는 구간까지 그린다 — 고양이
      # 외곽선처럼 닫힌 윤곽이 이것이다.
      #
      # ⚠️ vision 규약: 첫 점을 끝에 중복해 넣지 않는다. 닫는 것은 소비자 몫이라
      #    이 노드가 알아서 한 점을 더 붙인다. 좌표에 첫 점을 또 넣으면 안 된다.
      closed: [false, false, false, false, false]

      left_ear:  [ 50.0, 30.0,  52.0, 28.0,  55.0, 27.0,  58.0, 28.0,  60.0, 30.0]
      right_ear: [100.0, 30.0, 103.0, 28.0, 106.0, 27.0, 109.0, 28.0, 112.0, 30.0]
      left_eye:  [ 70.0, 50.0,  75.0, 50.0]
      right_eye: [ 85.0, 50.0,  90.0, 50.0]
      mouth:     [ 60.0, 70.0,  70.0, 75.0,  80.0, 75.0,  90.0, 70.0]
