# MuJoCo 백엔드 전용 joint_limits — 원본 hcr_moveit_config/config/joint_limits.yaml
# 의 복사본이며, joint_1 · joint_6 에 위치 한계 덮어쓰기를 추가한 것만 다르다.
#
# ── 왜 필요한가 ────────────────────────────────────────────────────────────
# hcr_robot.xacro 에서 joint_1 · joint_6 의 한계는 [0.0, 6.283185] 이다.
# 나머지 네 관절은 전부 ±대칭인데 이 둘만 하한이 0 이고, 하필 SRDF 의 hcr_home
# 이 그 둘을 **정확히 0** — 즉 하한 위에 둔다.
#
# mock_hardware 는 관절값으로 정확히 0.0 을 돌려주므로 아무 일도 없다. 그러나
# MuJoCo 는 실제 물리를 풀기 때문에 -1.06e-14 같은 부동소수점 노이즈를 돌려주고,
# 그 순간 시작 상태가 한계 밖이 되어 플래닝이 통째로 실패한다:
#
#   [check_start_state_bounds] Joint 'joint_1' from the starting state is
#   outside bounds by: [-1.06465e-14] should be in the range [0], [6.28318].
#
# ── 시도했으나 안 되는 것들 (반복하지 말 것) ────────────────────────────────
#  · `ompl.fix_start_state: true`
#      그 파라미터는 continuous · planar · floating 관절의 회전값 정규화만 한다
#      (플러그인 설명 원문). joint_1 은 한계가 있는 revolute 라 대상이 아니다.
#  · request_adapters 에서 CheckStartStateBounds 제거
#      실패 지점이 한 단계 뒤로 밀릴 뿐이다. OMPL 의 상태공간도 같은 URDF 한계로
#      만들어지므로 "Skipping invalid start state (invalid bounds) /
#      There are no valid initial states!" 로 START_STATE_INVALID 가 난다.
#
# RobotModelLoader 가 robot_description_planning.joint_limits.<joint>.min_position
# / max_position 을 읽어 RobotModel 에 적용하므로, URDF 를 건드리지 않고 여기서
# 덮어쓸 수 있다 (원본 파일 헤더도 이 키들을 지원한다고 적고 있다).
#
# ── ⚠️ 한계: 이건 플래닝만 푼다 ────────────────────────────────────────────
# MJCF 는 같은 URDF 에서 변환되어 `range="0 6.28318"` 을 그대로 갖는다. 즉
# **MuJoCo 는 여전히 joint_1 을 0 미만으로 움직이지 않는다.** 여기서 한계를
# 넓히면 MoveIt 은 음수 구간을 지나는 궤적을 계획할 수 있게 되지만 시뮬레이터가
# 그걸 따라가지 못한다.
#
# 제대로 된 해결은 hcr_robot.xacro 의 joint_1 · joint_6 한계를 고치는 것이고,
# 그러면 MJCF 재변환이 필요하다 — 시뮬레이션팀과 함께 정해야 하는 사안이다.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

joint_limits:
  joint_1:
    has_velocity_limits: true
    max_velocity: 100.0
    has_acceleration_limits: true
    max_acceleration: 100.0
    # ↓ 원본에 없는 부분 — URDF 의 [0.0, 6.283185] 를 ±대칭으로 넓힌다
    has_position_limits: true
    min_position: -6.283185
    max_position: 6.283185
  joint_2:
    has_velocity_limits: true
    max_velocity: 100.0
    has_acceleration_limits: true
    max_acceleration: 100.0
  joint_3:
    has_velocity_limits: true
    max_velocity: 100.0
    has_acceleration_limits: true
    max_acceleration: 100.0
  joint_4:
    has_velocity_limits: true
    max_velocity: 100.0
    has_acceleration_limits: true
    max_acceleration: 100.0
  joint_5:
    has_velocity_limits: true
    max_velocity: 100.0
    has_acceleration_limits: true
    max_acceleration: 100.0
  joint_6:
    has_velocity_limits: true
    max_velocity: 100.0
    has_acceleration_limits: true
    max_acceleration: 100.0
    # ↓ 원본에 없는 부분 — joint_1 과 같은 이유
    has_position_limits: true
    min_position: -6.283185
    max_position: 6.283185
