services:
  moveit2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_NAME: rosuser
        USER_UID: "1000"
        USER_GID: "1000"
    image: moveit2_tutorial:jazzy
    container_name: moveit2_tutorial
    hostname: moveit2
    stdin_open: true
    tty: true
    network_mode: host           # ROS 2 DDS 통신을 위해 host 네트워크
    ipc: host                    # RViz shared memory
    privileged: false
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=/tmp/runtime-rosuser
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=42
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/home/rosuser/.Xauthority:ro
      - ../ws_moveit:/home/rosuser/ws_moveit:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: bash
