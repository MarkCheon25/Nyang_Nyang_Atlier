# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# ═══ 2026-08-05 실측/공식값 교체 ═══════════════════════════════════════════════
# 종전 max_velocity/max_acceleration 은 둘 다 100.0 인 CAD 더미값이었다.
# 100 rad/s = 5729°/s 로 HCR-5 공식 최대 관절속도(180°/s)의 약 32배 —
# 실기 연결 전 반드시 고쳐야 할 값이었다 (hanwha_robot_arm/docs/실기_연결_현황.md §5.1).
#
# · max_velocity 3.141593 rad/s = 180°/s
#     근거: User Manual v2.0 Appendix G "maximum speed of 180°/sec which can be
#     generated at the robot joint". URDF <limit velocity> 와 같은 값으로 맞췄다.
# · max_acceleration 3.0 rad/s² = 172°/s²  ← **추정값이다**
#     공식 매뉴얼에 관절 최대 가속도 항목이 없다. Appendix G 의 정지거리·정지시간
#     (J1 34.67°/0.61s · J2 31.60°/0.55s · J3 29.08°/0.51s, 브레이크 체결 0.03s)에서
#     등감속을 가정해 역산하면 약 3.6 rad/s² 가 나오는데, 시험 초기속도가 최대속도인지
#     불명확해 보수적으로 3.0 을 넣었다. **벤더 확인 대상** (업무목록 T1 ③).
#     소묘는 빠른 가속이 필요 없으므로 낮게 잡는 쪽이 안전하다.
# · scaling factor 0.1 은 유지 — 실기 첫 운전은 감속으로 시작한다 (BRD N4).
# ══════════════════════════════════════════════════════════════════════════════

# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.  # Increase the values below to 1.0 to always move at maximum speed.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
joint_limits:
  joint_1:
    has_velocity_limits: true
    max_velocity: 3.141593
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint_2:
    has_velocity_limits: true
    max_velocity: 3.141593
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint_3:
    has_velocity_limits: true
    max_velocity: 3.141593
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint_4:
    has_velocity_limits: true
    max_velocity: 3.141593
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint_5:
    has_velocity_limits: true
    max_velocity: 3.141593
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint_6:
    has_velocity_limits: true
    max_velocity: 3.141593
    has_acceleration_limits: true
    max_acceleration: 3.0
